[project]
name = "gzgk-agent"
version = "2.0.0"
description = "LangChain/LangGraph Multi-Agent Advisory Platform with PGVector Hybrid RAG, HITL Sandbox & Streaming Guardrails"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "langchain-core>=0.3.20",
    "langchain-openai>=0.2.10",
    "langgraph>=0.2.50",
    "mcp>=1.2.0",
    "tiktoken>=0.8.0",
    "grpcio>=1.66.0",
    "grpcio-tools>=1.66.0",
    "protobuf>=5.28.0",
    "httpx>=0.27.2",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
prod = [
    "psycopg[binary,pool]>=3.2.3",
    "langgraph-checkpoint-postgres>=2.0.5",
    "redis>=5.2.0",
    "aiokafka>=0.12.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
