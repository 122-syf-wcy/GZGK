[project]
name = "gzgk-mcp"
version = "2.0.0"
description = "Official Model Context Protocol (MCP) Server exposing GZGK Gaokao Tools, Official Policies Resources & Advisory Prompts"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.2",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]
