[project]
name = "gzgk-ml"
version = "2.0.0"
description = "CPU-isolated LightGBM & Log-Rank gRPC Inference Service for GZGK v2"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "grpcio>=1.66.0",
    "grpcio-tools>=1.66.0",
    "protobuf>=5.28.0",
    "numpy>=2.1.0",
    "pydantic>=2.9.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]
