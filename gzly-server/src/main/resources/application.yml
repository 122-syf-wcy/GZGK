server:
  port: 8082
  compression:
    enabled: true
    min-response-size: 2048
    mime-types: application/json,text/html,text/plain,text/css,application/javascript,application/xml,text/xml
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 200
    max-connections: 8192

spring:
  application:
    name: gzly-server

  # ---- MySQL ----
  datasource:
    url: jdbc:mysql://localhost:3306/gzly?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${GZLY_DB_USERNAME:root}
    password: ${GZLY_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000

  # ---- Redis ----
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # ---- Multipart ----
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  # ---- Jackson ----
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ---- MyBatis-Plus ----
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      # logic-delete disabled - no tables use deleted column

# ---- JWT ----
spring.mail:
  host: ${GZLY_MAIL_HOST:smtp.qq.com}
  port: ${GZLY_MAIL_PORT:465}
  username: ${GZLY_MAIL_USERNAME:}
  password: ${GZLY_MAIL_PASSWORD:}
  default-encoding: UTF-8
  properties:
    mail:
      smtp:
        auth: true
        ssl:
          enable: true
        connectiontimeout: 8000
        timeout: 8000
        writetimeout: 8000

gzly:
  jwt:
    secret: ${GZLY_JWT_SECRET:}
    expire-hours: 168
    admin-expire-hours: ${GZLY_ADMIN_JWT_EXPIRE_HOURS:8}

  admin:
    password: ${GZLY_ADMIN_PASSWORD:}
    password-hash: ${GZLY_ADMIN_PASSWORD_HASH:}
    login-lock-limit: ${GZLY_ADMIN_LOGIN_LOCK_LIMIT:5}
    login-window-seconds: ${GZLY_ADMIN_LOGIN_WINDOW_SECONDS:300}
    login-lock-seconds: ${GZLY_ADMIN_LOGIN_LOCK_SECONDS:900}

  # ---- AI (OpenAI 格式) ----
  ai:
    base-url: ${GZLY_AI_BASE_URL:}
    api-key: ${GZLY_AI_API_KEY:}
    model: ${GZLY_AI_MODEL:gpt-4o-mini}
    max-tokens: 2000
    temperature: 0.7
    system-prompt: >
      你是一名资深的贵州省高考志愿填报顾问。请基于提供的志愿方案数据，给出专业的匹配度分析和风险复核建议。
      注意：严禁出现结果承诺和绝对化措辞，必须提醒考生结合官方指南自主决策。

  ml:
    enabled: ${GZLY_ML_ENABLED:false}
    base-url: ${GZLY_ML_BASE_URL:http://127.0.0.1:8091}
    timeout-ms: ${GZLY_ML_TIMEOUT_MS:1200}
    # off = 完全关闭；shadow = 调用 ML 但只记录对比、不影响用户结果；active = 采用 ML 输出。
    # 兼容旧开关：mode 未设置时，enabled=true 等价 active，enabled=false 等价 off。
    mode: ${GZLY_ML_MODE:}

  # ---- 规则预测引擎参数（回测校准入口，默认为上线以来的启发式取值）----
  algo:
    fallback:
      # 基础概率模型：sigmoid / log-rank（对数位次正态 CDF）。
      # 2026-08-12 本地回测 A/B（70,205 评估对）：log-rank Brier 0.0155 vs sigmoid 0.0217（优 28.6%），
      # 命中率持平 0.9269，满足切换门禁 → 部署默认切为 log-rank；如需回退设 GZLY_ALGO_CHANCE_MODEL=sigmoid。
      # 注意：Java 类内默认值仍为 sigmoid（锁定单测基线），部署口径以本处为准。
      model: ${GZLY_ALGO_CHANCE_MODEL:log-rank}
      # log-rank 模型的对数空间波动下限；同分密度大省（河南）应上调。
      sigma-min: ${GZLY_ALGO_SIGMA_MIN:0.06}
      # 专业组省份退档折减先验：1:1 投档省约 0.01，105% 差额投档省 0.02-0.05，默认保守中值。
      group-withdraw-prior: ${GZLY_ALGO_GROUP_WITHDRAW_PRIOR:0.03}
      rank-scale-factor: ${GZLY_ALGO_RANK_SCALE_FACTOR:0.08}
      rank-scale-min: ${GZLY_ALGO_RANK_SCALE_MIN:1000}
      volatility-penalty-cap: 0.20
      volatility-penalty-factor: 0.5
      plan-penalty-cap: 0.15
      plan-penalty-factor: 0.5
      data-penalty-factor: 0.15
      hot-penalty-cap: 0.10
      hot-penalty-factor: 0.1

  skills:
    local-path: ${GZLY_SKILLS_LOCAL_PATH:/root/zhangxuefeng-skills}

  # ---- 缓存 TTL (秒) ----
  cache:
    university-ttl: 86400
    score-line-ttl: 86400

  rate-limit:
    enabled: true
    volunteer-generate-limit: 10
    volunteer-generate-window-seconds: 60
    ai-analysis-limit: 6
    ai-analysis-window-seconds: 60
    feedback-limit: 5
    feedback-window-seconds: 600
    encouragement-limit: 6
    encouragement-window-seconds: 600
    auth-login-limit: 5
    auth-login-window-seconds: 300
    qa-submit-limit: 10
    qa-submit-window-seconds: 600
    qa-like-limit: 60
    qa-like-window-seconds: 600
    algorithm-limit: 120
    algorithm-window-seconds: 60
